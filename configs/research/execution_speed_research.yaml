# Predeclared scenarios, not tuned on inner results. No outer/test evaluation.

# Cấu hình nghiên cứu tốc độ thực thi (execution speed research) cho môi trường giao dịch.
# Định nghĩa các biến thể khác nhau để kiểm tra hiệu suất, độ nhạy của các tham số trong quá trình học tăng cường.

version: execution-speed-research-v1
fold: development_2021
common:
  enabled: true
  no_trade_band: 0.002
  participation_cap: 0.01
  cost_aversion: 1.0
  risk_aversion: 1.0
  er_window: 10
  alpha_min: 0.05
  alpha_max: 0.80
  alpha_buy: 0.25
  alpha_sell: 0.75
variants:
  fixed: {speed_mode: fixed, cost_risk_brake: false}
  fixed_brake: {speed_mode: fixed, cost_risk_brake: true}
  er_brake: {speed_mode: efficiency_ratio, cost_risk_brake: true}
  asymmetric_brake: {speed_mode: asymmetric, cost_risk_brake: true}
