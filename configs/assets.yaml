# ==============================================================================
# H-MARL-GNN: ASSET UNIVERSE CONFIGURATION (V1)
# ==============================================================================
# Ticket: DATA-001 (P0)
#
# FILE NÀY ĐỂ LÀM GÌ?
# - Định nghĩa vũ trụ tài sản (assets) dùng trong môi trường giao dịch.
# - Tránh hard-code danh sách mã, nhóm ngành, benchmark trong mã nguồn Python.
# - Là nguồn duy nhất (single source of truth) để tạo dataset huấn luyện,
#   đánh giá chiến lược, và chia nhóm agent cho MARL.
# Các module khác (downloader, features, graph, env, agents) đọc file này.
#
# Tiêu chí lựa chọn:
#   1. Cổ phiếu vốn hóa lớn (Large Cap) niêm yết trên sàn Mỹ (NASDAQ / NYSE).
#   2. Thanh khoản cao, khối lượng giao dịch dồi dào để hạn chế trượt giá.
#   3. Có lịch sử giao dịch liên tục từ trước năm 2015 đến nay
#      (tránh rủi ro thiếu dữ liệu / IPO muộn).
#   4. Phân bổ trên 5 nhóm ngành (sectors) phục vụ Multi-Agent RL.
# Tổng số tài sản: 24 cổ phiếu thuộc 5 nhóm ngành + benchmark SPY.
# ==============================================================================

version: "1.0"

# Chỉ số tham chiếu (benchmark) để đánh giá hiệu suất chiến lược.
# LƯU Ý: SPY CHỈ dùng làm benchmark. Không đưa vào tensor [T, N, F]
# và không nằm trong action [N + 1]. N = 24.
benchmark:
  ticker: "SPY"
  name: "SPDR S&P 500 ETF Trust"
  sector: "index"
  agent_group: "index"

# Khoảng thời gian dữ liệu (train/val/test được chia riêng trong split.py).
date_range:
  start_date: "2015-01-01"
  end_date: "2025-12-31"

# Tiền mặt (cash): tài sản thứ N + 1 trong action, không phải cổ phiếu.
# risk_free_rate_annual dùng để tính Sharpe Ratio (và có thể dùng làm lãi tiền mặt).
# Lưu ý: lãi suất thực tế giai đoạn 2022-2025 cao hơn 2%, nên cân nhắc
# đặt theo từng giai đoạn hoặc chạy độ nhạy nếu Sharpe của baseline bị lệch.
cash:
  symbol: "CASH"
  risk_free_rate_annual: 0.02

# Danh sách các nhóm ngành (sectors)
sectors:
  technology:
    name: "Technology"
    description: "Phần mềm, phần cứng, bán dẫn và nền tảng số"
  financials:
    name: "Financials"
    description: "Ngân hàng thương mại, ngân hàng đầu tư và dịch vụ tài chính"
  healthcare:
    name: "Healthcare"
    description: "Dược phẩm, công nghệ sinh học và dịch vụ y tế"
  energy:
    name: "Energy"
    description: "Khai thác, lọc hóa dầu và năng lượng truyền thống"
  consumer:
    name: "Consumer"
    description: "Hàng tiêu dùng thiết yếu và hàng tiêu dùng không thiết yếu"

# Phân nhóm agent cho Multi-Agent RL (MARL-001)
# Energy và Consumer gộp chung do số lượng tài sản nhỏ (3 + 5 = 8).
agent_groups:
  technology:
    name: "Technology Agent"
    sectors: ["technology"]
  financials:
    name: "Financials Agent"
    sectors: ["financials"]
  healthcare:
    name: "Healthcare Agent"
    sectors: ["healthcare"]
  energy_consumer:
    name: "Energy & Consumer Agent"
    sectors: ["energy", "consumer"]

