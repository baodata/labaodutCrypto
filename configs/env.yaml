# configs/env.yaml
# Cấu hình Môi trường Giao dịch (Trading Environment)
# Ticket: ENV-001 -> ENV-007 (Thành viên A)

environment:
  # 1. Thông số vốn và chi phí
  initial_balance: 100000.0      # Vốn khởi điểm: 100,000 USD
  transaction_fee_pct: 0.001     # Phí giao dịch (Commission): 0.1%
  slippage_pct: 0.0005           # Trượt giá (Slippage): 0.05%

  # 2. Quy định giao dịch (Constraints)
  max_asset_weight: 0.20         # Ràng buộc rủi ro: Không dồn quá 20% vốn vào 1 cổ phiếu
  allow_short_selling: false     # Đồ án hiện tại chỉ đánh Long (Mua/Bán), không Short (Bán khống)
  
  # 3. Thông số cửa sổ thời gian
  lookback_window: 20            # Môi trường sẽ cung cấp dữ liệu 20 ngày gần nhất cho AI mỗi bước
  
  # 4. Cấu hình Phần thưởng (Reward Formulation)
  reward_scaling: 100.0          # Nhân phần thưởng lên 100 lần để Gradient của PPO không bị biến mất
  risk_free_rate: 0.02           # Lãi suất phi rủi ro (2%/năm) để tính Sharpe Ratio