# Cấu hình môi trường giao dịch (Trading Environment)
initial_cash: 100000.0        # Vốn ban đầu ($)
transaction_fee: 0.001        # Phí giao dịch 0.1% mỗi lần tái cơ cấu danh mục (10 bps)
reward_type: "net_return"     # Hàm thưởng: net_return, log_return, risk_adjusted
risk_penalty: 0.5             # Hệ số phạt biến động nếu dùng risk_adjusted
bankruptcy_threshold: 0.3     # Dừng sớm nếu giá trị danh mục giảm dưới 30% vốn ban đầu
