# CÁC THAM SỐ SẼ ĐƯỢC THÊM VÀO ĐÂY:
# - initial_capital: Số vốn ban đầu (ví dụ: 100000 USD)
# - transaction_cost_rate: Tỷ lệ phí giao dịch (ví dụ: 0.001 tức 0.1%)
# - reward_scaling: Tỷ lệ co giãn phần thưởng để giúp RL dễ hội tụ
# - reward_shaping: Định hình phần thưởng để hỗ trợ quá trình học
# - risk_penalty: Hệ số phạt khi danh mục rủi ro cao (lambda)
# - max_drawdown_limit: Ngưỡng tối đa cho phép sụt giảm tài khoản

