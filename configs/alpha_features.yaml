# Strict by default: current-vintage files cannot establish historical availability.
version: external-alpha-v1
strict_pit: true
vix:
  path: data/external/pit/macro_volatility.csv
  max_age_days: 7
fama_french:
  path: data/external/pit/ff3_daily.csv
  window: 60
  residual_window: 20
  max_age_days: 90
  ridge: 0.00000001
blackout:
  events_path: data/external/pit/events.csv
  coverage_path: data/external/pit/event_coverage.csv
  pre_sessions: 2
  post_sessions: 1
