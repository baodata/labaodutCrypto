# Allocation-only comparison. Predictor is selected and locked separately.
version: portfolio-decision-v1
seeds: [7, 17, 27, 37, 47]
methods: [convex, ppo, sector_marl, hmarl]
training:
  epochs: 20
  min_epochs: 5
  patience: 5
  patience_min_delta: 0.00001
  train_probe_windows: 3
  train_probe_days: 126
  selection_window: 3
  selection_margin: 0.03
  hidden_dim: 32
  action_std: 0.10
  episodes_per_update: 8
  window_min: 63
  window_max: 126
  ppo_iters: 5
  batch_size: 256
  learning_rate: 0.0003
  target_kl: 0.03
  gamma: 0.95
  gae_lambda: 0.95
  reward_scale: 100.0
  cpu_threads: 1
