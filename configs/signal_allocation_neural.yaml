# Allocation/risk/execution identical to signal_allocation.yaml; only model list expands.
version: signal-allocation-v1
models: [ridge_fixed, momentum, mean_reversion, gru, gnn_gru]
horizons: [5, 20]
tilt_fraction: 0.25
risk_aversion: 10.0
cost_multiplier: 1.0
risk:
  method: ledoit_wolf
  window: 60
  min_periods: 60
  decay: 0.94
  jitter: 0.000000000001
execution:
  accounting: cash_funded
  impact_eta: 0.0
  rebalance_every_sessions: 1
