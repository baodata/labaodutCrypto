[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "h-marl-gnn"
version = "0.1.0"
description = "Hierarchical Multi-Agent Reinforcement Learning with Heterogeneous Dynamic Graph Neural Networks for Algorithmic Trading"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]

